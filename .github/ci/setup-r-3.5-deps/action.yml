name: Set up R 3.5 dependencies
description: >
  Installs the package's dependencies on R 3.5 from a Posit Package Manager
  snapshot whose versions still install there, including S7 0.1.0, and
  versions the rlang dependency in DESCRIPTION for old testthat.

inputs:
  snapshot:
    description: The Posit Package Manager snapshot date.
    required: true
  fields:
    description: Comma-separated DESCRIPTION fields whose packages to install.
    default: Imports, Suggests
  extra-packages:
    description: Comma-separated packages to install as well.
    default: rcmdcheck
  cache-key:
    description: >
      Prefix for the library cache key. Give each caller its own, so a cache
      never holds packages another caller installed.
    required: true

runs:
  using: composite
  steps:
    - name: Install system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/install-system-deps.sh"

    # No restore-keys: an older cache could hold a package that has since
    # left these fields.
    - uses: actions/cache@v4
      with:
        path: ${{ env.R_LIBS_USER }}
        key: ${{ runner.os }}-${{ inputs.cache-key }}-r-3.5-ppm-${{ inputs.snapshot }}-${{ hashFiles('DESCRIPTION') }}

    - name: Install R dependencies
      shell: bash
      env:
        SNAPSHOT: ${{ inputs.snapshot }}
        FIELDS: ${{ inputs.fields }}
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: Rscript "$GITHUB_ACTION_PATH/install-deps.R"

    - name: Version the rlang dependency
      shell: bash
      run: Rscript "$GITHUB_ACTION_PATH/version-rlang.R"
