name: CRAN submission
description: >
  Builds the package with its PDF manual and submits it to CRAN, which then
  emails the maintainer to confirm.

inputs:
  cran-environment:
    description: >
      The `cran` environment's CRAN_ENVIRONMENT variable. The submission
      refuses to run unless it's 'true'.
    required: true

runs:
  using: composite
  steps:
    - name: Require the configured cran environment
      shell: bash
      env:
        CRAN_ENVIRONMENT: ${{ inputs.cran-environment }}
      run: bash "$GITHUB_ACTION_PATH/require-environment.sh"

    - uses: r-lib/actions/setup-pandoc@v2

    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    - uses: ./.github/ci/setup-latex

    # upload_cran() is internal to devtools, so devtools is pinned to a
    # version known to have it with this signature.
    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-packages: devtools@2.5.2, any::pkgbuild
        needs: build

    - name: Build and submit to CRAN
      shell: bash
      run: Rscript "$GITHUB_ACTION_PATH/submit.R"
