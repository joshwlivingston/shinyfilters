name: R CMD check without Suggests
description: >
  Runs R CMD check on one R version with only "hard" dependencies (Depends,
  Imports, LinkingTo) plus testthat, knitr, and rmarkdown. No shared cache is
  used, so a cached Suggests package can't be restored.

inputs:
  id:
    description: The matrix entry's id, used in artifact names.
    required: true
  r:
    description: The R version, or '3.5' for 3.5.0 (3.5.1 on Windows).
    required: true
  http-user-agent:
    description: Passed to r-lib/actions/setup-r.
    default: ''
  r35-snapshot:
    description: Posit Package Manager snapshot date for R 3.5.
    required: true
  dev-imports:
    description: Comma-separated pak refs to the Imports' development versions, installed on R-devel.
    required: true

runs:
  using: composite
  steps:
    - uses: r-lib/actions/setup-pandoc@v2

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ inputs.r == '3.5' && (runner.os == 'Windows' && '3.5.1' || '3.5.0') || inputs.r }}
        http-user-agent: ${{ inputs.http-user-agent }}
        use-public-rspm: ${{ inputs.r != '3.5' }}

    - uses: r-lib/actions/setup-r-dependencies@v2
      if: inputs.r != '3.5'
      with:
        dependencies: '"hard"'
        cache: false
        extra-packages: ${{ inputs.r == 'devel' && format('any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown, {0}', inputs.dev-imports) || 'any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown' }}
        needs: check

    # R 3.5 builds from source, so it keeps a cache of its own that only ever
    # holds what this action installs.
    - uses: ./.github/ci/setup-r-3.5-deps
      if: inputs.r == '3.5'
      with:
        snapshot: ${{ inputs.r35-snapshot }}
        fields: Imports
        extra-packages: rcmdcheck, testthat, knitr, rmarkdown
        cache-key: check-no-suggests

    - uses: r-lib/actions/check-r-package@v2
      with:
        upload-snapshots: true
        build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
        artifact-name: check-no-suggests-${{ runner.os }}-${{ inputs.id }}-results
        snapshot-artifact-name: check-no-suggests-${{ runner.os }}-${{ inputs.id }}-testthat-snapshots
