name: pkgdown build
description: >
  Builds the pkgdown dev site. When deploying, also builds each release's site
  and uploads the combined site for pkgdown-deploy.

inputs:
  deploy:
    description: "'true' to build the release sites and upload the combined site."
    required: true
  site-url:
    description: The site's URL.
    required: true

runs:
  using: composite
  steps:
    - uses: r-lib/actions/setup-pandoc@v2

    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-packages: any::pkgdown, local::.
        needs: website

    - name: Build dev site
      shell: bash
      env:
        PKGDOWN_DEV_MODE: devel
        SOURCE_REF: ${{ github.event.repository.default_branch }}
      run: Rscript "$GITHUB_ACTION_PATH/build-dev-site.R"

    # The latest release is served at the root, each earlier release at
    # /<version>/, and the dev site at /dev/. /<latest version>/ redirects to
    # the root and /<dev version>/ to /dev/. Each deploy replaces the whole
    # site, so built releases are cached, and a release is only built when
    # it's new or the URL it's served at has changed. Releases are built with
    # the templates on this ref, and the cache key includes a hash of them and
    # of this action, so changing how sites are built rebuilds them all.
    - name: Find releases
      id: releases
      if: inputs.deploy == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/find-releases.sh"

    - name: Restore release sites
      if: inputs.deploy == 'true'
      uses: actions/cache@v4
      with:
        path: releases
        key: pkgdown-releases-${{ hashFiles('.github/ci/pkgdown-build/**', 'pkgdown/templates/**') }}-${{ steps.releases.outputs.key }}
        restore-keys: pkgdown-releases-${{ hashFiles('.github/ci/pkgdown-build/**', 'pkgdown/templates/**') }}-

    - name: Build release sites
      if: inputs.deploy == 'true'
      shell: bash
      env:
        PKGDOWN_DEV_MODE: release
        SITE_URL: ${{ inputs.site-url }}
        TAGS: ${{ steps.releases.outputs.tags }}
        LATEST: ${{ steps.releases.outputs.latest }}
      run: Rscript "$GITHUB_ACTION_PATH/build-release-sites.R"

    - name: Combine sites
      if: inputs.deploy == 'true'
      shell: bash
      env:
        SITE_URL: ${{ inputs.site-url }}
        TAGS: ${{ steps.releases.outputs.tags }}
        LATEST: ${{ steps.releases.outputs.latest }}
      run: bash "$GITHUB_ACTION_PATH/combine-sites.sh"

    - name: Upload Pages artifact
      if: inputs.deploy == 'true'
      uses: actions/upload-pages-artifact@v5
      with:
        path: site
