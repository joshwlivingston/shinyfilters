name: Test coverage
description: Measures test coverage and uploads it to Codecov.

inputs:
  codecov-token:
    description: The CODECOV_TOKEN secret (composite actions can't read secrets).
    default: ''

runs:
  using: composite
  steps:
    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-packages: any::covr, any::xml2
        needs: coverage

    - name: Test coverage
      shell: bash
      run: Rscript "$GITHUB_ACTION_PATH/coverage.R"

    # Skipped under act: .github/act/event.json sets github.event.act.
    - uses: codecov/codecov-action@v5
      if: ${{ !github.event.act }}
      with:
        # Fail on error off pull requests, or on one when a token is given.
        fail_ci_if_error: ${{ github.event_name != 'pull_request' || inputs.codecov-token != '' }}
        files: ./cobertura.xml
        plugins: noop
        disable_search: true
        token: ${{ inputs.codecov-token }}

    - name: Show testthat output
      if: always()
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/show-testthat-output.sh"

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-test-failures
        path: ${{ runner.temp }}/package
