name: R CMD check
description: >
  Runs R CMD check as CRAN does, building the PDF manual and vignettes, on one
  R version.

inputs:
  id:
    description: The matrix entry's id, used in artifact names.
    required: true
  r:
    description: The R version, or '3.5' for 3.5.0 (3.5.1 on Windows).
    required: true
  http-user-agent:
    description: Passed to r-lib/actions/setup-r.
    default: ''
  r35-snapshot:
    description: Posit Package Manager snapshot date for R 3.5.
    required: true
  dev-imports:
    description: Comma-separated pak refs to the Imports' development versions, installed on R-devel.
    required: true

runs:
  using: composite
  steps:
    - uses: r-lib/actions/setup-pandoc@v2

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ inputs.r == '3.5' && (runner.os == 'Windows' && '3.5.1' || '3.5.0') || inputs.r }}
        http-user-agent: ${{ inputs.http-user-agent }}
        use-public-rspm: ${{ inputs.r != '3.5' }}

    - uses: ./.github/ci/setup-latex

    - name: Check that dev-imports lists every Import
      if: inputs.r == 'devel'
      shell: bash
      env:
        DEV_IMPORTS: ${{ inputs.dev-imports }}
      run: Rscript "$GITHUB_ACTION_PATH/check-dev-imports.R"

    - uses: r-lib/actions/setup-r-dependencies@v2
      if: inputs.r != '3.5'
      with:
        extra-packages: ${{ inputs.r == 'devel' && format('any::rcmdcheck, {0}', inputs.dev-imports) || 'any::rcmdcheck' }}
        needs: check

    - uses: ./.github/ci/setup-r-3.5-deps
      if: inputs.r == '3.5'
      with:
        snapshot: ${{ inputs.r35-snapshot }}
        cache-key: R-CMD-check

    - uses: r-lib/actions/check-r-package@v2
      with:
        upload-snapshots: true
        args: 'c("--as-cran")'
        build_args: 'c("--compact-vignettes=gs+qpdf")'
        artifact-name: R-CMD-check-${{ runner.os }}-${{ inputs.id }}-results
        snapshot-artifact-name: R-CMD-check-${{ runner.os }}-${{ inputs.id }}-testthat-snapshots
