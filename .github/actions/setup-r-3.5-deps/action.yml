name: Set up R 3.5 dependencies
description: >
  Installs the package's dependencies on R 3.5 from a Posit Package Manager
  snapshot whose versions still install there, including S7 0.1.0, and
  versions the rlang dependency in DESCRIPTION for old testthat.

inputs:
  snapshot:
    description: The Posit Package Manager snapshot date.
    required: true
  fields:
    description: Comma-separated DESCRIPTION fields whose packages to install.
    default: Imports, Suggests
  extra-packages:
    description: Comma-separated packages to install as well.
    default: rcmdcheck
  cache-key:
    description: >
      Prefix for the library cache key. Give each caller its own, so a cache
      never holds packages another caller installed.
    required: true

runs:
  using: composite
  steps:
    - name: Install system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y make zlib1g-dev libicu-dev libxml2-dev libcurl4-openssl-dev libssl-dev

    # No restore-keys: an older cache could hold a package that has since
    # left these fields.
    - uses: actions/cache@v4
      with:
        path: ${{ env.R_LIBS_USER }}
        key: ${{ runner.os }}-${{ inputs.cache-key }}-r-3.5-ppm-${{ inputs.snapshot }}-${{ hashFiles('DESCRIPTION') }}

    - name: Install R dependencies
      shell: Rscript {0}
      env:
        SNAPSHOT: ${{ inputs.snapshot }}
        FIELDS: ${{ inputs.fields }}
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        split <- function(x) trimws(strsplit(x, ",")[[1]])
        options(
          repos = c(CRAN = paste0("https://packagemanager.posit.co/cran/", Sys.getenv("SNAPSHOT"))),
          Ncpus = 4
        )
        fields <- read.dcf("DESCRIPTION", split(Sys.getenv("FIELDS")))
        pkgs <- split(paste(fields[!is.na(fields)], collapse = ","))
        pkgs <- sub("[ (].*", "", pkgs)
        pkgs <- setdiff(pkgs, c("", rownames(installed.packages(priority = "base"))))
        pkgs <- c(pkgs, split(Sys.getenv("EXTRA_PACKAGES")))
        needed <- setdiff(pkgs, rownames(installed.packages()))
        if (length(needed) > 0) install.packages(needed)
        missing <- setdiff(pkgs, rownames(installed.packages()))
        if (length(missing) > 0) stop("Failed to install: ", paste(missing, collapse = ", "))
        if (packageVersion("S7") != "0.1.0") stop("Expected S7 0.1.0, got ", packageVersion("S7"))
        sessionInfo()

    # testthat < 3.2.0 shows conditions in snapshots the way current testthat
    # does only for packages whose rlang dependency has a version. The
    # package's own DESCRIPTION leaves rlang unversioned.
    - name: Version the rlang dependency
      shell: Rscript {0}
      run: |
        desc <- readLines("DESCRIPTION")
        i <- grep("^[[:space:]]+rlang,$", desc)
        if (length(i) != 1) stop("Can't find the rlang dependency in DESCRIPTION")
        desc[i] <- sub("rlang,", "rlang (>= 1.0.0),", desc[i], fixed = TRUE)
        writeLines(desc, "DESCRIPTION")
