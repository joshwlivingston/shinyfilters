# The CI pipeline. Each job calls one stage's workflow; `needs` orders the
# stages, and each starts only after the previous one passes:
#
#   air -> jarl -> R CMD check, check without Suggests, coverage, and
#   (releases) R-hub -> pkgdown build -> pkgdown deploy (not PRs) -> CRAN
#   submission (releases, after approval)
#
# PRs and pushes check on Linux; releases also check on Windows and macOS.
# Under act, .github/act/event.json sets github.event.act, which skips the
# stages that need GitHub's services.
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: ci.yaml

permissions: read-all

jobs:
  air:
    uses: ./.github/workflows/air.yaml

  jarl:
    needs: air
    uses: ./.github/workflows/jarl.yaml

  # Both checks take the same inputs (act rejects YAML aliases):
  # - r35-snapshot: its versions still install on R 3.5, including S7 0.1.0.
  # - dev-imports: R-devel installs these development versions of the Imports.
  R-CMD-check:
    needs: jarl
    uses: ./.github/workflows/R-CMD-check.yaml
    with:
      r35-snapshot: "2023-09-15"
      dev-imports: github::r-lib/cli, github::rstudio/htmltools, github::r-lib/rlang, github::RConsortium/S7, github::rstudio/shiny

  check-no-suggests:
    needs: jarl
    uses: ./.github/workflows/check-no-suggests.yaml
    with:
      r35-snapshot: "2023-09-15"
      dev-imports: github::r-lib/cli, github::rstudio/htmltools, github::r-lib/rlang, github::RConsortium/S7, github::rstudio/shiny

  test-coverage:
    needs: jarl
    uses: ./.github/workflows/test-coverage.yaml
    secrets: inherit

  # Needs the RHUB_TOKEN secret from rhub::rhub_setup().
  rhub:
    needs: jarl
    if: github.event_name == 'release' && !github.event.act
    uses: ./.github/workflows/rhub.yaml
    with:
      config: linux,windows,macos
    secrets: inherit

  pkgdown-build:
    needs: [R-CMD-check, check-no-suggests, test-coverage, rhub]
    # rhub is skipped off releases, which would otherwise skip this job too.
    if: >-
      !cancelled() &&
      needs.R-CMD-check.result == 'success' &&
      needs.check-no-suggests.result == 'success' &&
      needs.test-coverage.result == 'success' &&
      (needs.rhub.result == 'success' || needs.rhub.result == 'skipped')
    uses: ./.github/workflows/pkgdown-build.yaml

  pkgdown-deploy:
    needs: pkgdown-build
    # Explicit: rhub, upstream, is skipped off releases.
    if: >-
      !cancelled() &&
      needs.pkgdown-build.result == 'success' &&
      github.event_name != 'pull_request' &&
      !github.event.act
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/pkgdown-deploy.yaml

  # Needs the `cran` environment set up as described in cran.yaml.
  cran:
    needs: pkgdown-deploy
    if: >-
      !cancelled() &&
      needs.pkgdown-deploy.result == 'success' &&
      github.event_name == 'release' &&
      !github.event.release.prerelease &&
      !github.event.act
    uses: ./.github/workflows/cran.yaml
