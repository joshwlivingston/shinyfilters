# Each stage runs only after the previous one passes:
# air -> jarl -> R CMD check (including without Suggests) and coverage -> pkgdown
# build -> pkgdown deploy. PRs and pushes check on Linux; releases also check
# on Windows and macOS.
#
# Derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: ci.yaml

permissions: read-all

jobs:
  air:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: posit-dev/setup-air@v1

      - name: Check formatting
        run: air format . --check

  jarl:
    needs: air
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: etiennebacher/setup-jarl@v0.1.1

  R-CMD-check:
    needs: jarl
    runs-on: ${{ matrix.os }}

    name: R-CMD-check ${{ matrix.os }} (${{ matrix.config.id }})

    # R-devel failures are reported but don't block later stages.
    continue-on-error: ${{ matrix.config.r == 'devel' }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'release' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        config:
          # The oldest supported R: 3.5.0, or 3.5.1 on Windows. Dependencies
          # come from a Posit Package Manager snapshot whose versions still
          # install on R 3.5, including S7 0.1.0.
          - {id: 'r-3.5', r: '3.5'}
          - {id: 'oldrel-1', r: 'oldrel-1'}
          - {id: 'release', r: 'release'}
          - {id: 'devel', r: 'devel', http-user-agent: 'release'}
          # Installs only "hard" dependencies (Depends, Imports, LinkingTo),
          # plus testthat, knitr, and rmarkdown, without the cache, so a
          # cached Suggests package can't be restored.
          - {id: 'no-suggests', r: 'release', no-suggests: true}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      R35_SNAPSHOT: "2023-09-15"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.id == 'r-3.5' && (runner.os == 'Windows' && '3.5.1' || '3.5.0') || matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: ${{ matrix.config.id != 'r-3.5' }}

      # LaTeX for the PDF manual
      - uses: r-lib/actions/setup-tinytex@v2
        if: ${{ !matrix.config.no-suggests }}

      # TinyTeX doesn't include makeindex, which R-devel needs to build the
      # manual's index.
      - name: Install makeindex
        if: ${{ !matrix.config.no-suggests }}
        run: tlmgr install makeindex

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: matrix.config.id != 'r-3.5'
        with:
          dependencies: ${{ matrix.config.no-suggests && '"hard"' || '"all"' }}
          cache: ${{ !matrix.config.no-suggests }}
          extra-packages: ${{ matrix.config.no-suggests && 'any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown' || 'any::rcmdcheck' }}
          needs: check

      - name: Install system dependencies (R 3.5)
        if: matrix.config.id == 'r-3.5' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y make zlib1g-dev libicu-dev libxml2-dev libcurl4-openssl-dev libssl-dev

      - uses: actions/cache@v4
        if: matrix.config.id == 'r-3.5'
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-3.5-ppm-${{ env.R35_SNAPSHOT }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: ${{ runner.os }}-r-3.5-ppm-${{ env.R35_SNAPSHOT }}-

      - name: Install R dependencies (R 3.5)
        if: matrix.config.id == 'r-3.5'
        shell: Rscript {0}
        run: |
          options(
            repos = c(CRAN = paste0("https://packagemanager.posit.co/cran/", Sys.getenv("R35_SNAPSHOT"))),
            Ncpus = 4
          )
          fields <- read.dcf("DESCRIPTION", c("Imports", "Suggests"))
          pkgs <- trimws(unlist(strsplit(fields[!is.na(fields)], ",")))
          pkgs <- sub("[ (].*", "", pkgs)
          pkgs <- c(setdiff(pkgs, c("", rownames(installed.packages(priority = "base")))), "rcmdcheck")
          needed <- setdiff(pkgs, rownames(installed.packages()))
          if (length(needed) > 0) install.packages(needed)
          missing <- setdiff(pkgs, rownames(installed.packages()))
          if (length(missing) > 0) stop("Failed to install: ", paste(missing, collapse = ", "))
          if (packageVersion("S7") != "0.1.0") stop("Expected S7 0.1.0, got ", packageVersion("S7"))
          sessionInfo()

      # testthat < 3.2.0 shows conditions in snapshots the way current testthat
      # does only for packages whose rlang dependency has a version. The
      # package's own DESCRIPTION leaves rlang unversioned.
      - name: Version the rlang dependency (R 3.5)
        if: matrix.config.id == 'r-3.5'
        shell: Rscript {0}
        run: |
          desc <- readLines("DESCRIPTION")
          i <- grep("^[[:space:]]+rlang,$", desc)
          if (length(i) != 1) stop("Can't find the rlang dependency in DESCRIPTION")
          desc[i] <- sub("rlang,", "rlang (>= 1.0.0),", desc[i], fixed = TRUE)
          writeLines(desc, "DESCRIPTION")

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: ${{ matrix.config.no-suggests && 'c("--no-manual", "--as-cran")' || 'c("--as-cran")' }}
          build_args: ${{ matrix.config.no-suggests && 'c("--no-manual", "--compact-vignettes=gs+qpdf")' || 'c("--compact-vignettes=gs+qpdf")' }}
          artifact-name: R-CMD-check-${{ matrix.os }}-${{ matrix.config.id }}-results
          snapshot-artifact-name: R-CMD-check-${{ matrix.os }}-${{ matrix.config.id }}-testthat-snapshots

  test-coverage:
    needs: jarl
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v5
        with:
          # Fail if error if not on PR, or if on PR and token is given
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

  pkgdown:
    needs: [R-CMD-check, test-coverage]
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY: ${{ github.event_name != 'pull_request' }}
      SITE_URL: https://joshwlivingston.github.io/shinyfilters
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # build_site_github_pages() resolves source links before it applies
      # `override`, so each site's ref is set when its pkgdown object is created.
      # pkgdown renders every top-level .md file, so AGENTS.md is removed first.
      - name: Build dev site
        run: |
          unlink("AGENTS.md")
          pkg <- pkgdown::as_pkgdown(
            ".",
            override = list(repo = list(branch = Sys.getenv("SOURCE_REF")))
          )
          pkgdown::build_site_github_pages(
            pkg,
            new_process = FALSE,
            install = FALSE
          )
        shell: Rscript {0}
        env:
          PKGDOWN_DEV_MODE: devel
          SOURCE_REF: ${{ github.event.repository.default_branch }}

      # The latest release is served at the root, each earlier release at
      # /<version>/, and the dev site at /dev/. /<latest version>/ redirects to
      # the root and /<dev version>/ to /dev/. Each deploy replaces the whole
      # site, so built releases are cached, and a release is only built when
      # it's new or the URL it's served at has changed. Releases are built with
      # the templates on this ref, and the cache key includes a hash of them
      # and of this file, so changing how sites are built rebuilds them all.
      # A failed lookup fails the step, so `latest` is only empty when there
      # are no releases.
      - name: Find releases
        id: releases
        if: env.DEPLOY == 'true'
        run: |
          tags=$(gh release list --exclude-drafts --exclude-pre-releases --json tagName --jq '[.[].tagName] | join(" ")')
          latest=
          if [ -n "$tags" ]; then
            latest=$(gh release view --json tagName --jq .tagName)
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "key=$(echo "$tags $latest" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore release sites
        if: env.DEPLOY == 'true'
        uses: actions/cache@v4
        with:
          path: releases
          key: pkgdown-releases-${{ hashFiles('.github/workflows/ci.yaml', 'pkgdown/templates/**') }}-${{ steps.releases.outputs.key }}
          restore-keys: pkgdown-releases-${{ hashFiles('.github/workflows/ci.yaml', 'pkgdown/templates/**') }}-

      - name: Build release sites
        if: env.DEPLOY == 'true'
        run: |
          url <- Sys.getenv("SITE_URL")
          latest <- Sys.getenv("LATEST")
          templates <- file.path(getwd(), "pkgdown", "templates")
          tags <- strsplit(trimws(Sys.getenv("TAGS")), " ")[[1]]
          for (tag in tags) {
            version <- sub("^v", "", tag)
            dest <- file.path(getwd(), "releases", version)
            site_url <- if (tag == latest) url else paste0(url, "/", version)
            # Reuse a cached site only if it was built for the URL it's served at.
            built <- file.path(dest, "pkgdown.yml")
            if (file.exists(built)) {
              built_url <- yaml::read_yaml(built)$urls$reference
              if (identical(built_url, paste0(site_url, "/reference"))) next
            }
            src <- file.path(tempdir(), tag)
            system2("git", c("worktree", "add", src, tag))
            unlink(file.path(src, "AGENTS.md"))
            pak::local_install_deps(src, upgrade = FALSE, dependencies = TRUE)
            pkg <- pkgdown::as_pkgdown(
              src,
              override = list(
                destination = dest,
                url = site_url,
                repo = list(branch = tag),
                template = list(path = templates)
              )
            )
            pkgdown::build_site_github_pages(
              pkg,
              dest_dir = dest,
              install = TRUE,
              new_process = TRUE
            )
          }
        shell: Rscript {0}
        env:
          PKGDOWN_DEV_MODE: release
          TAGS: ${{ steps.releases.outputs.tags }}
          LATEST: ${{ steps.releases.outputs.latest }}

      - name: Combine sites
        if: env.DEPLOY == 'true'
        run: |
          # redirect <site> <url> <dir>: for each page of <site>, writes a page
          # to <dir> that redirects to the same page under <url>.
          redirect() {
            (cd "$1" && find . -name '*.html' -printf '%P\n') | while read -r page; do
              target="$2/$page"
              case "$target" in */index.html) target="${target%index.html}" ;; esac
              mkdir -p "$3/$(dirname "$page")"
              printf '%s\n' \
                '<!DOCTYPE html>' \
                '<meta charset="utf-8">' \
                '<title>Redirecting</title>' \
                '<meta name="robots" content="noindex">' \
                "<link rel=\"canonical\" href=\"$target\">" \
                "<script>location.replace(\"$target\" + location.search + location.hash)</script>" \
                "<meta http-equiv=\"refresh\" content=\"0; url=$target\">" \
                > "$3/$page"
            done
          }
          if [ -n "$LATEST" ]; then
            cp -r "releases/${LATEST#v}" site
          else
            cp -r docs/dev site
          fi
          for tag in $TAGS; do
            if [ "$tag" = "$LATEST" ]; then
              redirect "releases/${tag#v}" "$SITE_URL" "site/${tag#v}"
            else
              cp -r "releases/${tag#v}" "site/${tag#v}"
            fi
          done
          cp -r docs/dev site/dev
          dev=$(sed -n 's/^Version: *//p' DESCRIPTION)
          [ -e "site/$dev" ] || redirect docs/dev "$SITE_URL/dev" "site/$dev"
          # The version menu lists the latest release, dev, then each earlier
          # release. The list replaces the menu's fallback item in every page
          # on each deploy, so cached sites also list releases published after
          # they were built.
          item='<li><a class="dropdown-item" href="%s">%s</a></li>'
          items=$(
            if [ -n "$LATEST" ]; then
              printf "$item" "$SITE_URL/" "${LATEST#v} (latest)"
            fi
            printf "$item" "$SITE_URL/dev/" dev
            for tag in $TAGS; do
              if [ "$tag" != "$LATEST" ]; then
                printf "$item" "$SITE_URL/${tag#v}/" "${tag#v}"
              fi
            done
          )
          find site -name '*.html' -exec sed -i "s|<li class=\"version-menu\"><a [^>]*>[^<]*</a></li>|$items|" {} +
          # Every page with a navbar must now hold the list. If the pattern
          # above stops matching what pkgdown writes, the deploy fails instead
          # of publishing menus that list one version.
          pages=$(grep -rl --include='*.html' '<nav' site || true)
          unfilled=$(for page in $pages; do grep -qF -- "$items" "$page" || echo "$page"; done)
          if [ -z "$pages" ] || [ -n "$unfilled" ]; then
            echo "::error::The version menu wasn't filled in on these pages:"
            echo "${unfilled:-(no page has a navbar)}"
            exit 1
          fi
        env:
          TAGS: ${{ steps.releases.outputs.tags }}
          LATEST: ${{ steps.releases.outputs.latest }}

      - name: Upload Pages artifact
        if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: pkgdown
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5
