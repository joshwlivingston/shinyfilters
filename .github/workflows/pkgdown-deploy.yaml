# Deploys the site built by pkgdown-build.yaml to GitHub Pages.
# Called by ci.yaml, which decides when it runs.
on:
  workflow_call:

name: pkgdown-deploy.yaml

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5
