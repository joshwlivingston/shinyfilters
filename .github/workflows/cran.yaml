# Submits the release to CRAN.
# Called by ci.yaml, which decides when it runs.
on:
  workflow_call:

name: cran.yaml

jobs:
  # Submits the release to CRAN. Waits for approval through the `cran`
  # environment's required reviewer, then CRAN emails the maintainer to confirm.
  # Set up the environment with a required reviewer and the environment
  # variable CRAN_ENVIRONMENT=true: GitHub creates a missing environment with
  # no protection, so the job refuses to submit without that variable. Set it
  # on the environment only, never on the repository: `vars` merges both.
  cran:
    runs-on: ubuntu-latest
    environment: cran
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require the configured cran environment
        if: vars.CRAN_ENVIRONMENT != 'true'
        run: |
          echo "::error::The cran environment isn't configured; see the comment on this job."
          exit 1

      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # LaTeX for the PDF manual
      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install makeindex
        run: tlmgr install makeindex

      # upload_cran() is internal to devtools, so devtools is pinned to a
      # version known to have it with this signature.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: devtools@2.5.2, any::pkgbuild
          needs: build

      - name: Build and submit to CRAN
        shell: Rscript {0}
        run: |
          built <- pkgbuild::build(".", tempdir(), manual = TRUE)
          devtools:::upload_cran(".", built)
