# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build dev site
        run: |
          pkgdown::build_site_github_pages(
            new_process = FALSE,
            install = FALSE,
            override = list(repo = list(branch = Sys.getenv("SOURCE_REF")))
          )
        shell: Rscript {0}
        env:
          PKGDOWN_DEV_MODE: devel
          SOURCE_REF: ${{ github.event.repository.default_branch }}

      # Each release is served at /<version>/, the latest release also at the
      # root, and the dev site at /dev/. Each deploy replaces the whole site,
      # so built releases are cached and only new releases are built.
      - name: Find releases
        id: releases
        if: env.DEPLOY == 'true'
        run: |
          tags=$(gh release list --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' | tr '\n' ' ')
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "latest=$(gh release view --json tagName --jq .tagName 2>/dev/null)" >> "$GITHUB_OUTPUT"
          echo "key=$(echo "$tags" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore release sites
        if: env.DEPLOY == 'true'
        uses: actions/cache@v4
        with:
          path: releases
          key: pkgdown-releases-v2-${{ steps.releases.outputs.key }}
          restore-keys: pkgdown-releases-v2-

      - name: Build release sites
        if: env.DEPLOY == 'true'
        run: |
          url <- "https://joshwlivingston.github.io/shinyfilters"
          tags <- strsplit(trimws(Sys.getenv("TAGS")), " ")[[1]]
          for (tag in tags) {
            version <- sub("^v", "", tag)
            dest <- file.path(getwd(), "releases", version)
            if (dir.exists(dest)) next
            src <- file.path(tempdir(), tag)
            system2("git", c("worktree", "add", src, tag))
            pak::local_install_deps(src, upgrade = FALSE, dependencies = TRUE)
            pkgdown::build_site_github_pages(
              src,
              dest_dir = dest,
              install = TRUE,
              new_process = TRUE,
              override = list(
                url = paste0(url, "/", version),
                repo = list(branch = tag)
              )
            )
          }
        shell: Rscript {0}
        env:
          PKGDOWN_DEV_MODE: release
          TAGS: ${{ steps.releases.outputs.tags }}

      - name: Combine sites
        if: env.DEPLOY == 'true'
        run: |
          if [ -n "$LATEST" ]; then
            cp -r "releases/${LATEST#v}" site
          else
            cp -r docs/dev site
          fi
          for tag in $TAGS; do
            cp -r "releases/${tag#v}" "site/${tag#v}"
          done
          cp -r docs/dev site/dev
        env:
          TAGS: ${{ steps.releases.outputs.tags }}
          LATEST: ${{ steps.releases.outputs.latest }}

      - name: Upload Pages artifact
        if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: pkgdown
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5
