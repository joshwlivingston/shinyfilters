# Runs R CMD check as CRAN does, building the PDF manual and vignettes, on
# every supported R version. Releases also check on Windows and macOS.
# Called by ci.yaml, which decides when it runs.
#
# Derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  workflow_call:
    inputs:
      r35-snapshot:
        description: Posit Package Manager snapshot date for R 3.5.
        type: string
        required: true
      dev-imports:
        description: Comma-separated pak refs to the Imports' development versions.
        type: string
        required: true

name: R-CMD-check.yaml

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }} (${{ matrix.config.id }})

    # R-devel failures are reported but don't block later stages.
    continue-on-error: ${{ matrix.config.r == 'devel' }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'release' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        config:
          # The oldest supported R: 3.5.0, or 3.5.1 on Windows.
          - {id: 'r-3.5', r: '3.5'}
          - {id: 'oldrel-1', r: 'oldrel-1'}
          - {id: 'release', r: 'release'}
          # Installs the development versions of the Imports.
          - {id: 'devel', r: 'devel', http-user-agent: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      DEV_IMPORTS: ${{ inputs.dev-imports }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.id == 'r-3.5' && (runner.os == 'Windows' && '3.5.1' || '3.5.0') || matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: ${{ matrix.config.id != 'r-3.5' }}

      # LaTeX for the PDF manual
      - uses: r-lib/actions/setup-tinytex@v2

      # TinyTeX doesn't include makeindex, which R-devel needs to build the
      # manual's index.
      - name: Install makeindex
        run: tlmgr install makeindex

      - name: Check that dev-imports lists every Import
        if: matrix.config.r == 'devel'
        shell: Rscript {0}
        run: |
          imports <- trimws(strsplit(read.dcf("DESCRIPTION", "Imports"), ",")[[1]])
          imports <- setdiff(sub("[ (].*", "", imports), rownames(installed.packages(priority = "base")))
          dev <- sub(".*/", "", trimws(strsplit(Sys.getenv("DEV_IMPORTS"), ",")[[1]]))
          if (!setequal(imports, dev)) {
            stop("dev-imports doesn't match Imports: ", paste(sort(union(setdiff(imports, dev), setdiff(dev, imports))), collapse = ", "))
          }

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: matrix.config.id != 'r-3.5'
        with:
          extra-packages: ${{ matrix.config.r == 'devel' && format('any::rcmdcheck, {0}', inputs.dev-imports) || 'any::rcmdcheck' }}
          needs: check

      - uses: ./.github/actions/setup-r-3.5-deps
        if: matrix.config.id == 'r-3.5'
        with:
          snapshot: ${{ inputs.r35-snapshot }}
          cache-key: R-CMD-check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--as-cran")'
          build_args: 'c("--compact-vignettes=gs+qpdf")'
          artifact-name: R-CMD-check-${{ matrix.os }}-${{ matrix.config.id }}-results
          snapshot-artifact-name: R-CMD-check-${{ matrix.os }}-${{ matrix.config.id }}-testthat-snapshots
