# Runs R CMD check on the same R versions as R-CMD-check.yaml, with only
# "hard" dependencies (Depends, Imports, LinkingTo) plus testthat, knitr, and
# rmarkdown. No shared cache is used, so a cached Suggests package can't be
# restored.
# Called by ci.yaml, which decides when it runs.
on:
  workflow_call:
    inputs:
      r35-snapshot:
        description: Posit Package Manager snapshot date for R 3.5.
        type: string
        required: true
      dev-imports:
        description: Comma-separated pak refs to the Imports' development versions.
        type: string
        required: true

name: check-no-suggests.yaml

jobs:
  check-no-suggests:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }} (${{ matrix.config.id }})

    # R-devel failures are reported but don't block later stages.
    continue-on-error: ${{ matrix.config.r == 'devel' }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'release' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        config:
          - {id: 'r-3.5', r: '3.5'}
          - {id: 'oldrel-1', r: 'oldrel-1'}
          - {id: 'release', r: 'release'}
          - {id: 'devel', r: 'devel', http-user-agent: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.id == 'r-3.5' && (runner.os == 'Windows' && '3.5.1' || '3.5.0') || matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: ${{ matrix.config.id != 'r-3.5' }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: matrix.config.id != 'r-3.5'
        with:
          dependencies: '"hard"'
          cache: false
          extra-packages: ${{ matrix.config.r == 'devel' && format('any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown, {0}', inputs.dev-imports) || 'any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown' }}
          needs: check

      # R 3.5 builds from source, so it keeps a cache of its own that only
      # ever holds what this job installs.
      - uses: ./.github/actions/setup-r-3.5-deps
        if: matrix.config.id == 'r-3.5'
        with:
          snapshot: ${{ inputs.r35-snapshot }}
          fields: Imports
          extra-packages: rcmdcheck, testthat, knitr, rmarkdown
          cache-key: check-no-suggests

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          artifact-name: check-no-suggests-${{ matrix.os }}-${{ matrix.config.id }}-results
          snapshot-artifact-name: check-no-suggests-${{ matrix.os }}-${{ matrix.config.id }}-testthat-snapshots
